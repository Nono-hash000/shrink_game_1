<body style="margin:0;background:rgb(10,12,22);display:grid;place-items:center;min-height:100vh;overflow:hidden">
<canvas id=C width=800 height=400 style="background:rgb(14,18,30);border:2px solid rgb(50,40,75);max-width:95vw;max-height:90vh"></canvas>
<script>
(()=>{
  const x = C.getContext('2d');
  const W = 800, H = 400, B = 30, S = 22, PX = 100;
  const BG = 'rgb(14,18,30)', CY = 'rgb(0,240,255)', RED = 'rgb(255,60,90)', WH = 'rgb(255,255,255)';

  let st = 'start', py = H - B - S, vy = 0, g = 0.6, score = 0, best = 0;
  let obs = [], pts = [], tr = [], tm = 60;

  function reset() {
    score = vy = 0;
    obs = []; pts = []; tr = [];
    tm = 50; g = 0.6; py = H - B - S;
    st = 'playing';
  }

  function act() {
    if (st !== 'playing') reset();
    else { g = -g; vy = g * 2; }
  }

  onkeydown = e => { if (e.code === 'Space') { act(); e.preventDefault(); } };
  onpointerdown = act;

  function crash() {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * 6.28, s = Math.random() * 7 + 2;
      pts.push({ x: PX + 11, y: py + 11, vx: Math.cos(a) * s, vy: Math.sin(a) * s, sz: Math.random() * 4 + 2, a: 1, c: Math.random() < 0.5 ? RED : CY });
    }
    if (score > best) best = score;
    st = 'gameover';
  }

  function update() {
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i];
      p.x += p.vx; p.y += p.vy; p.a -= 0.02;
      if (p.a <= 0) pts.splice(i, 1);
    }
    if (st !== 'playing') return;

    vy += g; py += vy;
    if (py <= B) { py = B; vy = 0; }
    else if (py >= H - B - S) { py = H - B - S; vy = 0; }
    score++;

    tr.push({ y: py, a: 0.6 });
    if (tr.length > 5) tr.shift();
    for (const t of tr) t.a -= 0.1;

    const spd = 5 + Math.min(score * 0.001, 4);
    if (--tm <= 0) {
      const top = Math.random() < 0.5, h = Math.random() * 100 + 40, w = Math.random() * 15 + 25;
      obs.push({ x: W, y: top ? B : H - B - h, w, h });
      tm = Math.max(38, 75 - Math.floor(score / 500));
    }

    for (let i = obs.length - 1; i >= 0; i--) {
      const o = obs[i];
      o.x -= spd;
      if (PX < o.x + o.w && PX + S > o.x && py < o.y + o.h && py + S > o.y) {
        crash(); break;
      }
      if (o.x + o.w < 0) obs.splice(i, 1);
    }
  }

  function draw() {
    x.fillStyle = BG;
    x.fillRect(0, 0, W, H);

    x.strokeStyle = 'rgba(255,255,255,0.03)';
    const off = (score * 3) % 40;
    for (let l = -off; l < W; l += 40) {
      x.beginPath(); x.moveTo(l, B); x.lineTo(l, H - B); x.stroke();
    }

    x.fillStyle = 'rgb(22,28,44)';
    x.fillRect(0, 0, W, B); x.fillRect(0, H - B, W, B);
    x.fillStyle = CY; x.fillRect(0, B - 2, W, 2);
    x.fillStyle = 'rgb(255,50,120)'; x.fillRect(0, H - B, W, 2);

    for (const o of obs) {
      x.fillStyle = RED; x.fillRect(o.x, o.y, o.w, o.h);
      x.fillStyle = 'rgb(255,140,160)'; x.fillRect(o.x + 2, o.y + 2, o.w - 4, o.h - 4);
    }

    if (st !== 'gameover') {
      for (const t of tr) {
        if (t.a > 0) {
          x.fillStyle = 'rgba(0,240,255,' + t.a + ')';
          x.fillRect(PX, t.y, S, S);
        }
      }
      x.fillStyle = CY; x.fillRect(PX, py, S, S);
      x.fillStyle = WH; x.fillRect(PX + 3, py + 3, S - 6, S - 6);

      x.fillStyle = BG;
      x.beginPath();
      const cy = py + 11, d = g > 0 ? 1 : -1;
      x.moveTo(PX + 11, cy + d * 5);
      x.lineTo(PX + 7, cy - d * 3);
      x.lineTo(PX + 15, cy - d * 3);
      x.fill();
    }

    for (const p of pts) {
      x.fillStyle = p.c;
      x.globalAlpha = Math.max(0, p.a);
      x.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
    }
    x.globalAlpha = 1;

    x.fillStyle = WH;
    x.font = 'bold 15px monospace';
    x.textAlign = 'left';
    x.fillText('SCORE: ' + score, 20, 20);
    x.fillStyle = 'rgb(255,255,0)';
    x.fillText('BEST: ' + Math.max(score, best), W - 120, 20);

    x.textAlign = 'center';
    if (st === 'start') {
      x.fillStyle = 'rgba(10,12,22,0.7)'; x.fillRect(0, 0, W, H);
      x.fillStyle = CY; x.font = 'bold 28px monospace';
      x.fillText('GRAV-FLIP', W / 2, H / 2 - 15);
      x.fillStyle = WH; x.font = '14px monospace';
      x.fillText('PRESS SPACE', W / 2, H / 2 + 20);
    } else if (st === 'gameover') {
      x.fillStyle = 'rgba(10,12,22,0.75)'; x.fillRect(0, 0, W, H);
      x.fillStyle = RED; x.font = 'bold 28px monospace';
      x.fillText('CRASHED!', W / 2, H / 2 - 25);
      x.fillStyle = WH; x.font = '16px monospace';
      x.fillText('SCORE: ' + score, W / 2, H / 2 + 10);
      x.font = '13px monospace';
      x.fillText('PRESS SPACE', W / 2, H / 2 + 35);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
